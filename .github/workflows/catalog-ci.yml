name: Builder Catalog CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python pinned action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit catalogue
        run: python -m omega_builder catalog-audit
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q omega_builder
