[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "absolute-omega-agent-builder-infinity"
version = "0.2.0"
description = "Builder catalog and audited mathematical reasoning primitives; Zeus held"
requires-python = ">=3.11"

[project.optional-dependencies]
math = ["numpy>=1.26,<3"]
ml = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]
umap = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2", "umap-learn>=0.5.7,<1"]
visual = ["matplotlib>=3.8,<4"]
thermodynamic = ["jax", "thrml"]
hdc = ["torch", "torchhd"]
mesh = ["eclipse-zenoh>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["omega_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
