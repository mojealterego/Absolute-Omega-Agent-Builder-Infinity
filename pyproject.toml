[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "absolute-omega-agent-builder-infinity"
version = "0.2.0"
description = "Builder catalog and audited mathematical reasoning primitives; Zeus held"
requires-python = ">=3.11"

[project.optional-dependencies]
math = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["omega_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
